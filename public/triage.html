<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Signal: AI triage</title><link rel="stylesheet" href="base.css">
<style>.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button[aria-pressed=true]{background:#e5202e;border-color:#e5202e;color:#fff}
ul{list-style:none;padding:0;display:grid;gap:10px}li{background:var(--card);border:1px solid var(--line);border-left-width:8px;border-radius:12px;padding:12px 16px}.msg{font-size:18px;font-weight:600;margin:0 0 8px}.why{margin:8px 0 0}.why span{color:var(--mut)}</style></head>
<body><div id="nav"></div><div class="wrap"><h1 style="margin:0">Read every message. Rank by need, not by who wrote first.</h1>
<p class="note">Synthetic messages, ranked ahead of time by an LLM and checked by a person. The AI only suggests an order.</p>
<div class="chips" id="chips"></div><ul id="list"></ul></div>
<script src="shared.js"></script><script src="triage-data.js"></script>
<script>
const LV={5:['Critical','#e5202e'],4:['Urgent','#f08030'],3:['Soon','#f0c030'],2:['Routine','#2fb67c'],1:['Low','#6b7c8c']};let f=0;
function draw(){const rows=M.filter(x=>!f||x.u===f).sort((a,b)=>b.u-a.u);
  chips.innerHTML=[0,5,4,3,2,1].map(n=>`<button data-f="${n}" aria-pressed="${n===f}">${n?n+' '+LV[n][0]:'All'}</button>`).join('');
  list.innerHTML=rows.map(x=>`<li style="border-left-color:${LV[x.u][1]}"><p class="msg">“${x.m}”</p><span class="pill" style="background:${LV[x.u][1]};${x.u===3?'color:#1a1a1a':''}">${x.u} · ${LV[x.u][0]}</span> <span class="note">${x.t}</span><p class="why"><span>Why the AI ranked it here:</span> ${x.r}</p></li>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){f=+b.dataset.f;draw()}});
mountNav('/triage.html');draw();
</script></body></html>
